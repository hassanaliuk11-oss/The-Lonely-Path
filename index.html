    /**
     * ROMAN NUMERAL HELPER
     */
    function toRoman(num) {
        const lookup = { M: 1000, CM: 900, D: 500, CD: 400, C: 100, XC: 90, L: 50, XL: 40, X: 10, IX: 9, V: 5, IV: 4, I: 1 };
        let roman = '';
        for (let i in lookup) {
            while (num >= lookup[i]) {
                roman += i;
                num -= lookup[i];
            }
        }
        return roman;
    }

    function renderJournal() {
        const container = document.getElementById('content-container');
        container.innerHTML = Journal.articles.map((article, index) => `
            <article class="a5-card">
                <span class="poem-num">${toRoman(index + 1)}</span>
                <h2 class="article-title">${article.title}</h2>
                <div class="article-body">${article.content}</div>
                <div class="article-footer">${article.date}</div>
            </article>
        `).join('');
        lucide.createIcons();
    }

    function toggleStudio() {
        document.getElementById('studioPanel').classList.toggle('open');
    }

    function setTheme(t, btn) {
        document.body.className = 'theme-' + t;
        setActive(btn);
    }

    function updateStyle(variable, value, btn) {
        document.documentElement.style.setProperty(variable, value);
        setActive(btn);
    }

    function setActive(btn) {
        if(!btn) return;
        const parent = btn.parentElement;
        parent.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function updateClock() {
        const now = new Date();
        const options = { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
        const timeStr = now.toLocaleString('en-US', options).toUpperCase().replace(',', ' •');
        document.getElementById('live-clock').textContent = timeStr;
    }

    async function downloadPDF() {
        const element = document.getElementById('capture-area');
        const opt = {
            margin: 10,
            filename: 'Hassan_Jatoi_Archives.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        await html2pdf().set(opt).from(element).save();
    }

    window.onload = () => {
        renderJournal();
        setInterval(updateClock, 1000);
        updateClock();
        lucide.createIcons();
    };
</script>
