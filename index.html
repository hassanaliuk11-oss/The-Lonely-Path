:root {
    --bg-deep: #050505;
    --bg-accent: #0f0f12;
    --gold: #c5a059;
    --gold-bright: #e5c385;
    --text-main: #e0e0e0;
    --text-dim: #999;
    --card-glass: rgba(255, 255, 255, 0.03);
    --border-glass: rgba(197, 160, 89, 0.15);
    --page-max-width: 780px;
    --font-serif: 'Lora', serif;
    --font-display: 'Cinzel', serif;
    --content-size: 19px;
    --content-align: center;
}

/* Themes */
.theme-midnight { --bg-deep: #050505; --bg-accent: #0f0f12; --gold: #c5a059; --text-main: #e0e0e0; }
.theme-minimal { --bg-deep: #ffffff; --bg-accent: #f8f8f8; --gold: #1a1a1a; --text-main: #222; --text-dim: #666; --card-glass: #fff; --border-glass: #eee; }
.theme-noir { --bg-deep: #000000; --bg-accent: #111; --gold: #ffffff; --text-main: #eee; --text-dim: #888; --card-glass: rgba(255,255,255,0.02); --border-glass: #333; }
.theme-ocean { --bg-deep: #001219; --bg-accent: #00212e; --gold: #00b4d8; --text-main: #caf0f8; --border-glass: rgba(0, 180, 216, 0.2); }
.theme-emerald { --bg-deep: #06110a; --bg-accent: #0b1f12; --gold: #52b788; --text-main: #d8f3dc; --border-glass: rgba(82, 183, 136, 0.2); }
.theme-sunset { --bg-deep: #1a0f0f; --bg-accent: #2d1616; --gold: #ff4e50; --text-main: #f9dcc4; --border-glass: rgba(255, 78, 80, 0.2); }
.theme-cyber { --bg-deep: #0a0a0c; --bg-accent: #141417; --gold: #00ff41; --text-main: #00ff41; --border-glass: #00ff41; --card-glass: rgba(0,255,65,0.05); }

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

body {
    margin: 0; padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x: hidden;
    min-height: 100vh;
}

.live-status {
    position: fixed; top: 20px; left: 20px; z-index: 2000;
    background: var(--card-glass); border: 1px solid var(--border-glass);
    padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(10px);
    font-size: 10px; letter-spacing: 2px; color: var(--gold);
    display: flex; align-items: center; gap: 8px;
}
.pulse { width: 6px; height: 6px; background: #00ff41; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

.nav-dock { position: fixed; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 2000; }
.dock-circle {
    width: 56px; height: 56px; border-radius: 50%; background: var(--bg-accent);
    border: 1px solid var(--border-glass); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(15px);
}
.dock-circle:hover { transform: scale(1.1); background: var(--gold); color: var(--bg-deep); }

#studioPanel {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100dvh;
    background: var(--bg-accent); border-left: 1px solid var(--border-glass);
    z-index: 2100; padding: 30px 20px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(30px);
    overflow-y: auto;
}
#studioPanel.open { right: 0; }
.studio-header { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-display); color: var(--gold); border-bottom: 1px solid var(--border-glass); padding-bottom: 15px; }

.option-section { display: flex; flex-direction: column; gap: 10px; }
.section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); }
.grid-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.btn-opt { 
    background: transparent; border: 1px solid var(--border-glass); color: var(--text-main); 
    padding: 12px 8px; font-size: 10px; cursor: pointer; border-radius: 6px; 
    text-transform: uppercase; transition: 0.2s; 
}
.btn-opt:hover, .btn-opt.active { border-color: var(--gold); background: rgba(197, 160, 89, 0.1); color: var(--gold); }

.container { position: relative; z-index: 2; padding: 100px 15px 120px 15px; display: flex; flex-direction: column; align-items: center; }

.a5-card {
    width: 100%; max-width: var(--page-max-width);
    background: var(--card-glass); border: 1px solid var(--border-glass);
    padding: 80px 60px; margin-bottom: 60px; border-radius: 4px; 
    text-align: var(--content-align); transition: all 0.3s ease;
    page-break-inside: avoid; position: relative;
}

.poem-num {
    display: block; font-family: var(--font-display); color: var(--gold);
    font-size: 14px; letter-spacing: 4px; margin-bottom: 20px; opacity: 0.8;
}

.hero { border: none; background: transparent; text-align: center; margin-bottom: 100px; padding: 0; box-shadow: none; }
.cover-img { width: 200px; height: 300px; object-fit: cover; border: 1px solid var(--gold); border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.7); }

.article-title { font-family: var(--font-display); font-size: 32px; color: var(--gold); margin-bottom: 40px; letter-spacing: 3px; line-height: 1.3; }
.article-body { font-family: var(--font-serif); font-size: var(--content-size); line-height: 1.9; white-space: pre-line; color: var(--text-main); opacity: 0.9; }
.article-footer { margin-top: 60px; font-size: 11px; color: var(--text-dim); letter-spacing: 5px; text-transform: uppercase; border-top: 1px solid var(--border-glass); padding-top: 25px; }

@media screen and (max-width: 650px) {
    .a5-card { padding: 40px 25px; }
    .article-title { font-size: 24px; }
    .container { padding-top: 60px; }
}

@media print { .no-print { display: none !important; } }

<script>
function toggleStudio() {
    document.getElementById('studioPanel').classList.toggle('open');
}

function setTheme(theme, btn) {
    document.body.className = 'theme-' + theme;
    document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function updateStyle(varName, value, btn) {
    document.documentElement.style.setProperty(varName, value);
    document.querySelectorAll(btn.parentNode.children).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function downloadPDF() {
    const element = document.getElementById('capture-area');
    html2pdf().set({ margin: 0.5, filename: 'Hassan-Jatoi-Journal.pdf', html2canvas: { scale: 2 } }).from(element).save();
}
